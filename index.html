<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuhox Apps</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1f; --muted: #5d5d68; --line: #e5e5ea; --accent: #34c759;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111116; --fg: #ececf1; --muted: #9a9aa6; --line: #2a2a33; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang TC", "Noto Sans TC", sans-serif;
    padding: 48px 16px 80px;
  }
  main { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 28px; line-height: 1.3; margin: 0 0 6px; }
  h2 { font-size: 18px; margin: 36px 0 10px; }
  .updated { color: var(--muted); font-size: 14px; margin-bottom: 36px; }
  ul { padding-left: 1.3em; }
  strong { font-weight: 600; }
  hr { border: none; border-top: 1px solid var(--line); margin: 44px 0 24px; }
  footer { color: var(--muted); font-size: 14px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>Nuhox</h1>
<p class="updated">獨立開發的 iOS App</p>
<h2>PitchCoach 唱歌音準訓練</h2>
<p>即時音高偵測，告訴你唱的是哪個音、偏了幾個音分。完全離線。</p>
<ul><li><a href="pitchcoach/privacy.html">隱私政策</a></li></ul>
<h2>BreathPacer 呼吸節律引導</h2>
<p>共振呼吸、方塊呼吸、4-7-8。跟著圈圈呼吸，不用自己數秒。完全離線。</p>
<ul><li><a href="breathpacer/privacy.html">隱私政策</a></li></ul>
</main>
</body>
</html>
